<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tinashe 2026–27</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#17161a;--muted:#6b6a73;--line:#e6e3dd;--soft:#efede8;
--show:#E8A87C;--fest:#E98B8B;--travel:#B9A3DB;--off:#C9C9CC;--prep:#9DBCE3;--hold:#F2D57E;--bad:#C0362C;--badbg:#FBE7E4;--ok:#2E7D4F;--okbg:#E3F3E8}
@media (prefers-color-scheme:dark){:root{--bg:#111114;--panel:#1a1a1f;--ink:#f1f0ee;--muted:#9c9aa3;--line:#2b2a31;--soft:#222127;--badbg:#3a1d1b;--bad:#FF8A7F;--okbg:#17301f;--ok:#7BD49C}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;margin:6px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:22px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}.tile span{color:var(--muted);font-size:13px}
.next{grid-column:span 2;min-width:0}.next b{font-size:18px}.next .when{color:var(--muted);font-size:13px;margin-top:2px}
@media (max-width:520px){.next{grid-column:span 1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.card h2{font-size:15px;margin:0 0 10px;letter-spacing:.01em}
.card ul{margin:0;padding-left:18px}.card li{margin:3px 0}
.card a{color:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.toggle{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.month{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:26px 0 8px;font-weight:700}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:11px 14px;margin:6px 0}
.row.past{opacity:.45}.row.today{box-shadow:0 0 0 2px var(--ink)}
.date{text-align:center;line-height:1.05}.date .dow{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.date .day{font-size:24px;font-weight:700}.date .mon{font-size:11px;color:var(--muted);text-transform:uppercase}
.main{min-width:0}.city{font-weight:650}.venue{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--soft);white-space:nowrap}
.pill.type{color:#1b1a1e}.pill.act{color:#fff;font-weight:600}
.pill.st-booked{background:var(--okbg);color:var(--ok)}.pill.st-hold,.pill.st-tentative{background:#FFF1C9;color:#7A5B00}.pill.st-unverified{background:var(--badbg);color:var(--bad)}
.pill.conf{background:var(--badbg);color:var(--bad);font-weight:600;white-space:normal}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{color:var(--muted);padding:20px 0}
footer{color:var(--muted);font-size:12px;margin-top:36px}

.hero{position:relative;border-radius:18px;overflow:hidden;min-height:200px;display:flex;align-items:flex-end;margin-bottom:6px;color:#fff}
.hero .bg{position:absolute;inset:0}.hero .txt{position:relative;padding:22px 24px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.35) 70%,rgba(0,0,0,0));width:100%;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.hero .eyebrow,.hero .sub{color:rgba(255,255,255,.8)}
.coverhero{display:flex;gap:22px;align-items:center;background:#0b0b0b;color:#f2f1ee;border-radius:18px;padding:18px;border:1px solid var(--line)}.coverhero img{width:clamp(130px,26vw,240px);aspect-ratio:1;border-radius:10px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.5)}.coverhero .eyebrow,.coverhero .sub{color:rgba(242,241,238,.7)}
@media (max-width:520px){.coverhero{flex-direction:column;align-items:flex-start}}
.poster{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000}.poster img{display:block;width:100%;height:auto}.titleblock{margin:16px 2px 0}
.back{display:inline-block;margin-bottom:12px;color:var(--muted);text-decoration:none;font-size:13px}.back:hover{color:var(--ink)}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.route span{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:13px}.route i{color:var(--muted);font-style:normal}

.art{display:block;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){
.art .drift{animation:drift 14s ease-in-out infinite alternate}
.art .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
.art .d2{animation-delay:.8s}.art .d3{animation-delay:1.6s}.art .d4{animation-delay:2.4s}
.art .dash path{animation:dash 6s linear infinite}
.art .fly{animation:fly 6s ease-in-out infinite alternate}
.art .sweep{transform-origin:300px 0;animation:sweep 7s ease-in-out infinite alternate}
}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.08)}}
@keyframes dash{to{stroke-dashoffset:-90}}
@keyframes fly{from{transform:translate(400px,160px) rotate(-18deg)}to{transform:translate(470px,130px) rotate(-10deg)}}
@keyframes sweep{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}

@media (max-width:560px){.row{grid-template-columns:50px 1fr}.time{grid-column:2;text-align:left}}
</style></head><body><div class="wrap">

<script>window.__SITE__={"rows":[{"d":"2026-08-03","act":"Tinashe","type":"prep","city":"Los Angeles, CA","venue":"Previz (8/3–8/5)","time":"","note":"Confirmed","status":"confirmed","conflict":""},{"d":"2026-08-06","act":"Tinashe","type":"travel","city":"LAX → SFO","venue":"Travel","time":"","note":"Times TBD","status":"confirmed","conflict":""},{"d":"2026-08-07","act":"Tinashe","type":"fest","city":"San Francisco, CA","venue":"Outside Lands","time":"17:10","note":"Set 17:10–18:00","status":"confirmed","conflict":""},{"d":"2026-08-08","act":"Tinashe","type":"fest","city":"Seattle, WA","venue":"Capitol Hill Block Party","time":"TBD","note":"SFO → SEA same day","status":"confirmed","conflict":""},{"d":"2026-08-09","act":"Tinashe","type":"show","city":"Seattle, WA","venue":"DJ Set","time":"TBD","note":"Venue TBD","status":"confirmed","conflict":""},{"d":"2026-08-10","act":"Tinashe","type":"travel","city":"SEA → DTW","venue":"Travel","time":"","note":"","status":"hold","conflict":""},{"d":"2026-09-23","act":"Tinashe","type":"prep","city":"Previz suite TBD","venue":"Previz — ATG Merriweather (9/23–9/24)","time":"","note":"Hold, confirmation pending","status":"hold","conflict":"OMAM (NYC 9/23, Pittsburgh 9/24)"},{"d":"2026-09-27","act":"Tinashe","type":"travel","city":"Athens, GA → Atlanta, GA","venue":"Car service ATL after load-out (via Tinashe production) · ~90 min","time":"00:30","note":"Leaves as the OMAM bus pulls · ~90 min drive · at ATL ~2:00 AM","status":"hold","conflict":""},{"d":"2026-09-27","act":"Tinashe","type":"travel","city":"Atlanta → Baltimore (BWI)","venue":"Flight DL 1592 (ATL → BWI)","time":"07:25–09:16","note":"Leaving OMAM for Tinashe · Delta 737-900 · Gate A31 (Domestic Terminal South) → D25 · overnight at ATL airport, no hotel · BWI to venue ~20 min","status":"booked","conflict":""},{"d":"2026-09-27","act":"Tinashe","type":"fest","city":"Columbia, MD","venue":"Merriweather Post Pavilion","time":"TBD","note":"Festival","status":"tentative","conflict":"OMAM"},{"d":"2026-10-11","act":"Tinashe","type":"travel","city":"Detroit → Phoenix","venue":"Flight DL1070 (DTW → PHX)","time":"09:10–10:21","note":"Seat 32F · upgrade requested · overnight in Phoenix","status":"booked","conflict":"AVFX (Beverly Hilton)"},{"d":"2026-10-11","act":"Tinashe","type":"fest","city":"Mayer, AZ","venue":"FORM Arcosanti 2026","time":"TBD","note":"","status":"confirmed","conflict":"AVFX (Beverly Hilton)"},{"d":"2026-10-12","act":"Tinashe","type":"travel","city":"Phoenix → Los Angeles","venue":"Flight DL4057 (PHX → LAX)","time":"06:00–07:35","note":"Seat 13D · upgrade requested","status":"booked","conflict":""},{"d":"2026-10-15","act":"Tinashe","type":"travel","city":"LA → Chicago","venue":"Travel","time":"","note":"Origin LAX or DTW, times TBD","status":"hold","conflict":""},{"d":"2026-10-16","act":"Tinashe","type":"show","city":"Chicago, IL","venue":"The Salt Shed","time":"20:00","note":"Three Nights With A Popstar · Night 1","status":"confirmed","conflict":""},{"d":"2026-10-17","act":"Tinashe","type":"travel","city":"Chicago → home","venue":"Travel","time":"","note":"","status":"hold","conflict":""},{"d":"2026-10-23","act":"Tinashe","type":"travel","city":"LA → Brooklyn","venue":"Travel","time":"","note":"","status":"hold","conflict":"Cash Money"},{"d":"2026-10-24","act":"Tinashe","type":"show","city":"Brooklyn, NY","venue":"Brooklyn Paramount","time":"20:00","note":"Three Nights With A Popstar · Night 2","status":"confirmed","conflict":"Cash Money"},{"d":"2026-10-25","act":"Tinashe","type":"travel","city":"Brooklyn → Cape Town","venue":"Not flying home · straight to SWV with Taylor","time":"","note":"See SWV flight (change needed)","status":"hold","conflict":""},{"d":"2026-11-06","act":"Tinashe","type":"prep","city":"Los Angeles, CA","venue":"Prep / travel hold","time":"","note":"Local, no flight","status":"hold","conflict":"Cash Money · SWV travel"},{"d":"2026-11-07","act":"Tinashe","type":"show","city":"Los Angeles, CA","venue":"Hollywood Palladium","time":"20:00","note":"Three Nights With A Popstar · Night 3 · Hometown","status":"confirmed","conflict":"SWV (Thunder Valley) · Cash Money"},{"d":"2026-11-08","act":"Tinashe","type":"off","city":"Los Angeles, CA","venue":"Recovery","time":"","note":"","status":"confirmed","conflict":""},{"d":"2026-11-09","act":"Tinashe","type":"hold","city":"TBD","venue":"World Tour placeholder (11/9–11/30)","time":"","note":"Routing TBD","status":"hold","conflict":"OMAM (11/23–11/30) · Cash Money (11/13–15)"},{"d":"2027-04-02","act":"Tinashe","type":"show","city":"Glendale, AZ","venue":"State Farm Stadium","time":"19:00","note":"Night 1 of 2","status":"confirmed","conflict":""},{"d":"2027-04-03","act":"Tinashe","type":"show","city":"Glendale, AZ","venue":"State Farm Stadium","time":"19:00","note":"Night 2 of 2","status":"confirmed","conflict":""}],"actFilter":false};window.__COLORS__={"OMAM":"#3F6B57","Tinashe":"#7447B0","SWV":"#C2185B","Cash Money":"#B8860B","AVFX":"#5B6B82"};</script>
<script>
const S = window.__SITE__, COLORS = window.__COLORS__;
const TYPE = {show:['Show','var(--show)'],fest:['Festival','var(--fest)'],travel:['Travel','var(--travel)'],off:['Off','var(--off)'],prep:['Prep / Previz','var(--prep)'],hold:['Hold','var(--hold)']};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd = d => { const [y,m,dd] = d.split('-').map(Number); return new Date(y, m-1, dd); };
const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const iso = t => t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const TODAY = iso(today);
const state = { acts: new Set(), type: 'all', hidePast: false };
try { state.hidePast = localStorage.getItem('hidePast') === '1'; } catch (e) {}

function stats() {
  const R = S.rows;
  const shows = R.filter(r => r.type === 'show' || r.type === 'fest').length;
  const travel = R.filter(r => r.type === 'travel').length;
  const off = R.filter(r => r.type === 'off').length;
  const conf = new Set(R.filter(r => r.conflict).map(r => r.d)).size;
  const next = R.find(r => r.d >= TODAY && (r.type === 'show' || r.type === 'fest'));
  let nextHtml = '<b>Run complete</b>';
  if (next) {
    const days = Math.round((pd(next.d) - today) / 864e5);
    nextHtml = '<span>Next show</span><b>' + esc(next.city) + ' · ' + esc(next.venue) + '</b><div class="when">' +
      pd(next.d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) +
      (next.time ? ' · ' + esc(next.time) : '') + ' · ' + (days === 0 ? 'today' : 'in ' + days + ' day' + (days === 1 ? '' : 's')) +
      (S.actFilter ? ' · ' + esc(next.act) : '') + '</div>';
  }
  document.getElementById('stats').innerHTML =
    '<div class="tile next">' + nextHtml + '</div>' +
    '<div class="tile"><b>' + shows + '</b><span>Shows</span></div>' +
    '<div class="tile"><b>' + travel + '</b><span>Travel days</span></div>' +
    '<div class="tile"><b>' + off + '</b><span>Days off</span></div>' +
    '<div class="tile"><b>' + conf + '</b><span>Dates with conflicts</span></div>';
}

function filters() {
  const bar = document.getElementById('filters');
  let h = '';
  const types = [['all','All'],['shows','Shows'],['travel','Travel'],['off','Off / Prep / Holds'],['conflict','Conflicts']];
  h += types.map(([k,l]) => '<button class="chip" data-type="'+k+'" aria-pressed="'+(state.type===k)+'">'+l+'</button>').join('');
  if (S.actFilter) {
    const acts = [...new Set(S.rows.map(r => r.act))];
    h += '<span style="width:8px"></span>' + acts.map(a => '<button class="chip" data-act="'+esc(a)+'" aria-pressed="'+state.acts.has(a)+'"><i class="dot" style="background:'+COLORS[a]+'"></i>'+esc(a)+'</button>').join('');
  }
  h += '<label class="toggle"><input type="checkbox" id="hp" '+(state.hidePast?'checked':'')+'> Hide past dates</label>';
  bar.innerHTML = h;
  bar.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { state.type = b.dataset.type; filters(); list(); });
  bar.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { const a = b.dataset.act; state.acts.has(a) ? state.acts.delete(a) : state.acts.add(a); filters(); list(); });
  document.getElementById('hp').onchange = e => { state.hidePast = e.target.checked; try { localStorage.setItem('hidePast', state.hidePast ? '1' : '0'); } catch (err) {} list(); };
}

function keep(r) {
  if (state.hidePast && r.d < TODAY) return false;
  if (state.acts.size && !state.acts.has(r.act)) return false;
  switch (state.type) {
    case 'shows': return r.type === 'show' || r.type === 'fest';
    case 'travel': return r.type === 'travel';
    case 'off': return ['off','prep','hold'].includes(r.type);
    case 'conflict': return !!r.conflict;
  }
  return true;
}

function list() {
  const rows = S.rows.filter(keep);
  const el = document.getElementById('list');
  if (!rows.length) { el.innerHTML = '<div class="empty">Nothing matches these filters.</div>'; return; }
  let h = '', cur = '';
  for (const r of rows) {
    const dt = pd(r.d);
    const m = dt.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    if (m !== cur) { h += '<div class="month">' + m + '</div>'; cur = m; }
    const [tl, tc] = TYPE[r.type];
    const cls = 'row' + (r.d < TODAY ? ' past' : '') + (r.d === TODAY ? ' today' : '');
    h += '<div class="'+cls+'" style="--c:'+COLORS[r.act]+'">' +
      '<div class="date"><div class="dow">'+dt.toLocaleDateString('en-US',{weekday:'short'})+'</div><div class="day">'+dt.getDate()+'</div><div class="mon">'+dt.toLocaleDateString('en-US',{month:'short'})+'</div></div>' +
      '<div class="main"><div class="city">'+esc(r.city)+'</div><div class="venue">'+esc(r.venue)+'</div>' +
      '<div class="meta">' + (S.actFilter ? '<span class="pill act" style="background:'+COLORS[r.act]+'">'+esc(r.act)+'</span>' : '') +
      '<span class="pill type" style="background:'+tc+'">'+tl+'</span>' +
      (r.status !== 'confirmed' ? '<span class="pill st-'+r.status+'">'+r.status[0].toUpperCase()+r.status.slice(1)+'</span>' : '') +
      (r.conflict ? '<span class="pill conf">⚠ Conflict: '+esc(r.conflict)+'</span>' : '') + '</div>' +
      (r.note ? '<div class="note">'+esc(r.note)+'</div>' : '') + '</div>' +
      '<div class="time">'+esc(r.time)+'</div></div>';
  }
  el.innerHTML = h;
}

function ledger() {
  const el = document.getElementById('ledger'); if (!el) return;
  const t = S.rows.filter(r => r.type === 'travel');
  const label = { booked: 'Booked', hold: 'Hold / not booked', tentative: 'Tentative', confirmed: 'Scheduled' };
  el.innerHTML = '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Act</th><th>Route</th><th>Detail</th><th>Status</th></tr></thead><tbody>' +
    t.map(r => '<tr'+(r.d < TODAY ? ' style="opacity:.5"' : '')+'><td>'+pd(r.d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</td><td><i class="dot" style="background:'+COLORS[r.act]+'"></i> '+esc(r.act)+'</td><td>'+esc(r.city)+'</td><td>'+esc(r.venue)+(r.time ? ' · '+esc(r.time) : '')+'</td><td><span class="pill st-'+r.status+'">'+label[r.status]+'</span></td></tr>').join('') +
    '</tbody></table></div>';
}

stats(); filters(); list(); ledger();
</script></body></html>
